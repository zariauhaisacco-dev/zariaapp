<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B1F3A">
  <title>Zaria · Reset password</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/favicon/32" sizes="32x32">
  <link rel="icon" href="/favicon/192" sizes="192x192">
</head>
<body>
  <div class="layout">
    <aside class="brand-panel" aria-hidden="true">
      <div class="brand-inner">
        <div class="brand-mark"><span class="brand-mark-letter">Z</span></div>
        <h1 class="brand-name">Zaria</h1>
        <p class="brand-tagline">Fast, transparent loans.<br>Repay via M-Pesa.</p>
      </div>
      <footer class="brand-footer">
        <div class="contact-line"><strong>Talk to us</strong></div>
        <div class="contact-grid">
          <span>📞 0746 138 896</span>
          <span>✉️ info@zariauhai.com</span>
        </div>
      </footer>
    </aside>

    <main class="auth-panel">
      <div class="auth-inner">
        <header class="auth-header">
          <div class="auth-logo"><span class="brand-mark-letter">Z</span></div>
          <h2>Set a new password</h2>
          <p class="auth-sub">Choose a strong password — at least 8 characters.</p>
        </header>

        <form id="resetForm" class="auth-form" novalidate>
          <div class="field">
            <label for="password">New password</label>
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
          </div>

          <div class="field">
            <label for="confirm">Confirm new password</label>
            <input type="password" id="confirm" name="confirm" required minlength="8" autocomplete="new-password">
          </div>

          <div class="form-error" id="formError" role="alert" hidden></div>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
            <span class="btn-label">Reset password</span>
            <span class="btn-spinner" hidden></span>
          </button>
        </form>

        <div id="successWrap" hidden>
          <div style="padding:20px;border:1px solid #E5E2DD;background:#fff;border-radius:12px">
            <h2 style="margin:0 0 8px;font-size:18px">Password updated</h2>
            <p style="margin:0 0 16px;color:#6B7484;font-size:14px;line-height:1.5">
              Your password has been changed. You can now sign in with the new one.
            </p>
            <a href="/" class="btn btn-primary" style="text-decoration:none;display:inline-block;padding:12px 22px">Sign in</a>
          </div>
        </div>

        <p style="text-align:center;margin-top:24px;font-size:14px">
          <a href="/" class="link">Back to sign in</a>
        </p>
      </div>
    </main>
  </div>

  <script src="/js/reset-password.js" defer></script>

  
<script src="/js/reset-password-inline.js" defer></script>
</body>
</html>
