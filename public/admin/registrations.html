<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaria · Registrations</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="dash">
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-chip">Z</span><span class="brand-word">Zaria</span>
    </div>
    <div class="topbar-actions">
      <a class="btn-sm btn-outline" href="/admin/dashboard">Dashboard</a>
      <div class="avatar" id="avatarBtn">·</div>
    </div>
  </header>

      <aside class="sidebar" id="sidebar">
    <nav>
      <div class="nav-group">
        <div class="nav-group-label">Overview</div>
        <a class="nav-item" href="/admin/dashboard">Dashboard</a>
        <a class="nav-item" href="/admin/loans">Loans</a>
        <a class="nav-item" href="/admin/requests">Requests</a>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">People</div>
        <a class="nav-item" href="/admin/clients">Clients</a>
        <a class="nav-item active" href="/admin/registrations">Registrations</a>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">Money</div>
        <a class="nav-item" href="/admin/savings">Savings</a>
        <a class="nav-item" href="/admin/shares">Shares</a>
        <a class="nav-item" href="/admin/dividends">Dividends</a>
        <a class="nav-item" href="/admin/transactions">Transactions</a>
        <a class="nav-item" href="/admin/reports">Reports</a>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">System</div>
        <a class="nav-item" href="/admin/audit">Audit log</a>
        <a class="nav-item" href="/admin/settings">Settings</a>
      </div>
    </nav>
  </aside>



  <main class="main">
    <div class="page-head">
      <div>
        <h1 class="page-title">Pending registrations</h1>
        <p class="page-sub" id="pageSub">Loading…</p>
      </div>
      <div class="page-actions">
        <select id="statusFilter" class="btn-sm btn-outline" style="padding-right:8px">
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
          <option value="expired">Expired</option>
          <option value="all">All</option>
        </select>
        <button type="button" class="btn-sm btn-outline" id="refreshBtn">Refresh</button>
      </div>
    </div>

    <section class="card">
      <div id="listWrap" class="card-body tight">
        <div class="empty">Loading…</div>
      </div>
    </section>
  </main>
</div>

<div id="approveModal" hidden style="position:fixed;inset:0;background:rgba(11,31,58,0.5);display:grid;place-items:center;z-index:50;padding:20px">
  <div style="background:#fff;border-radius:12px;max-width:460px;width:100%;padding:24px;border:1px solid var(--line-1)">
    <h3 style="margin:0 0 8px;font-size:18px">Approve this application?</h3>
    <p id="approveBody" style="margin:0 0 20px;color:var(--ink-600);font-size:14px;line-height:1.5"></p>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button type="button" class="btn-sm btn-outline" id="approveCancel">Cancel</button>
      <button type="button" class="btn-sm btn-dark" id="approveConfirm">Approve</button>
    </div>
  </div>
</div>

<div id="rejectModal" hidden style="position:fixed;inset:0;background:rgba(11,31,58,0.5);display:grid;place-items:center;z-index:50;padding:20px">
  <div style="background:#fff;border-radius:12px;max-width:460px;width:100%;padding:24px;border:1px solid var(--line-1)">
    <h3 style="margin:0 0 12px;font-size:18px">Reject application</h3>
    <div class="field">
      <label for="rejectReason">Reason (sent to applicant if checked)</label>
      <input type="text" id="rejectReason" maxlength="500" placeholder="e.g. Duplicate account">
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin:12px 0 20px;font-size:13px;color:var(--ink-700)">
      <input type="checkbox" id="sendReason" checked> Include reason in the rejection email
    </label>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button type="button" class="btn-sm btn-outline" id="rejectCancel">Cancel</button>
      <button type="button" class="btn-sm btn-dark" id="rejectConfirm">Reject</button>
    </div>
  </div>
</div>

<script src="/js/admin-registrations.js" defer></script>

  
<script src="/js/admin-registrations-inline.js" defer></script>
</body>
</html>
