<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B1F3A">
  <title>Zaria · Audit log</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    .audit-filters {
      display: grid;
      grid-template-columns: 2fr 1.4fr 1fr 1fr 1fr;
      gap: 10px;
      padding: 16px;
    }
    @media (max-width: 900px) {
      .audit-filters { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 560px) {
      .audit-filters { grid-template-columns: 1fr; }
    }
    .audit-filters .field { display: grid; gap: 4px; }
    .audit-filters label {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-500);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .audit-filters input,
    .audit-filters select {
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid var(--line-1);
      border-radius: 6px;
      background: var(--surface-1);
      outline: none;
    }
    .audit-row {
      display: grid;
      grid-template-columns: 140px 1fr 120px 100px 140px;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line-1);
      font-size: 12.5px;
      align-items: start;
      cursor: pointer;
    }
    .audit-row:hover { background: var(--surface-2); }
    .audit-row:last-child { border-bottom: 0; }
    .audit-row.expanded { background: var(--surface-2); }
    @media (max-width: 720px) {
      .audit-row { grid-template-columns: 1fr; gap: 6px; }
    }
    .audit-ts { color: var(--ink-500); font-family: var(--font-mono); font-size: 11.5px; }
    .audit-action { font-weight: 600; color: var(--ink-900); }
    .audit-actor { color: var(--ink-600); font-size: 12px; }
    .audit-entity { color: var(--ink-500); font-family: var(--font-mono); font-size: 11.5px; }
    .audit-ip { color: var(--ink-400); font-family: var(--font-mono); font-size: 11px; }
    .audit-detail {
      display: none;
      padding: 12px 16px 20px 172px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line-1);
      font-size: 12px;
    }
    .audit-row.expanded + .audit-detail { display: block; }
    .audit-detail pre {
      margin: 0;
      padding: 10px 12px;
      background: var(--surface-1);
      border: 1px solid var(--line-1);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      overflow-x: auto;
      max-height: 240px;
      color: var(--ink-700);
    }
    .audit-detail .label {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-500);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 16px;
      border-top: 1px solid var(--line-1);
      flex-wrap: wrap;
    }
    .pagination button {
      padding: 6px 12px;
      font-size: 12.5px;
      background: var(--surface-1);
      border: 1px solid var(--line-1);
      border-radius: 6px;
      cursor: pointer;
      color: var(--ink-700);
      font-weight: 500;
    }
    .pagination button:hover:not(:disabled) { border-color: var(--line-2); }
    .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
    .pagination .page-info { color: var(--ink-500); font-size: 12.5px; }
  </style>
</head>
<body>
<div class="dash">

  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="topbar-brand"><span class="brand-chip">Z</span><span class="brand-word">Zaria</span></div>
    <div class="topbar-actions">
      <a class="btn-sm btn-outline" href="/admin/dashboard">Dashboard</a>
      <div class="avatar" id="avatarBtn">·</div>
    </div>
  </header>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside class="sidebar" id="sidebar">
    <nav>
      <div class="nav-group">
        <div class="nav-group-label">Overview</div>
        <a class="nav-item" href="/admin/dashboard">Dashboard</a>
        <a class="nav-item" href="/admin/loans">Loans</a>
        <a class="nav-item" href="/admin/savings">Savings</a>
        <a class="nav-item" href="/admin/shares">Shares</a>
        <a class="nav-item" href="/admin/dividends">Dividends</a>
        <a class="nav-item" href="/admin/requests">Requests</a>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">People</div>
        <a class="nav-item" href="/admin/clients">Clients</a>
        <a class="nav-item" href="/admin/registrations">Registrations</a>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">Money</div>
        <a class="nav-item" href="/admin/transactions">Transactions</a>
        <a class="nav-item" href="/admin/reports">Reports</a>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">System</div>
        <a class="nav-item active" href="/admin/audit">Audit log</a>
        <a class="nav-item" href="/admin/settings">Settings</a>
      </div>
    </nav>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1 class="page-title">Audit log</h1>
        <p class="page-sub" id="countLabel">Loading…</p>
      </div>
      <div class="page-actions">
        <a class="btn-sm btn-outline" id="exportBtn" href="#" style="text-decoration:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 20h16"/></svg>
          Export CSV
        </a>
      </div>
    </div>

    <!-- Filters -->
    <section class="card" style="margin-bottom:16px">
      <div class="audit-filters">
        <div class="field">
          <label for="qInput">Search action or email</label>
          <input type="search" id="qInput" placeholder="e.g. loan.approved, admin@…">
        </div>
        <div class="field">
          <label for="actionSelect">Action</label>
          <select id="actionSelect">
            <option value="">All actions</option>
          </select>
        </div>
        <div class="field">
          <label for="roleSelect">Role</label>
          <select id="roleSelect">
            <option value="">All roles</option>
            <option value="admin">Admin</option>
            <option value="client">Client</option>
            <option value="system">System</option>
          </select>
        </div>
        <div class="field">
          <label for="fromDate">From</label>
          <input type="date" id="fromDate">
        </div>
        <div class="field">
          <label for="toDate">To</label>
          <input type="date" id="toDate">
        </div>
      </div>
      <div style="padding:0 16px 16px;display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="btn-sm btn-dark" id="applyBtn">Apply filters</button>
        <button type="button" class="btn-sm btn-outline" id="clearBtn">Clear</button>
      </div>
    </section>

    <!-- List -->
    <section class="card">
      <div id="listWrap">
        <div class="empty" style="padding:40px 20px">Loading…</div>
      </div>
      <div id="paginationWrap"></div>
    </section>
  </main>
</div>

<script src="/js/admin-audit.js" defer></script>
</body>
</html>
