<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B1F3A">
  <title>Zaria · Audit log</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    .audit-filters {
      display: grid;
      grid-template-columns: 2fr 1.4fr 1fr 1fr 1fr;
      gap: 10px;
      padding: 16px;
    }
    @media (max-width: 900px) {
      .audit-filters { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 560px) {
      .audit-filters { grid-template-columns: 1fr; }
    }
    .audit-filters .field { display: grid; gap: 4px; }
    .audit-filters label {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-500);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .audit-filters input,
    .audit-filters select {
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid var(--line-1);
      border-radius: 6px;
      background: var(--surface-1);
      outline: none;
    }
    .audit-row {
      display: grid;
      grid-template-columns: 140px 1fr 120px 100px 140px;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line-1);
      font-size: 12.5px;
      align-items: start;
      cursor: pointer;
    }
    .audit-row:hover { background: var(--surface-2); }
    .audit-row:last-child { border-bottom: 0; }
    .audit-row.expanded { background: var(--surface-2); }
    @media (max-width: 720px) {
      .audit-row { grid-template-columns: 1fr; gap: 6px; }
    }
    .audit-ts { color: var(--ink-500); font-family: var(--font-mono); font-size: 11.5px; }
    .audit-action { font-weight: 600; color: var(--ink-900); }
    .audit-actor { color: var(--ink-600); font-size: 12px; }
    .audit-entity { color: var(--ink-500); font-family: var(--font-mono); font-size: 11.5px; }
    .audit-ip { color: var(--ink-400); font-family: var(--font-mono); font-size: 11px; }
    .audit-detail {
      display: none;
      padding: 12px 16px 20px 172px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line-1);
      font-size: 12px;
    }
    .audit-row.expanded + .audit-detail { display: block; }
    .audit-detail pre {
      margin: 0;
      padding: 10px 12px;
      background: var(--surface-1);
      border: 1px solid var(--line-1);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      overflow-x: auto;
      max-height: 240px;
      color: var(--ink-700);
    }
    .audit-detail .label {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-500);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 16px;
      border-top: 1px solid var(--line-1);
      flex-wrap: wrap;
    }
    .pagination button {
      padding: 6px 12px;
      font-size: 12.5px;
      background: var(--surface-1);
      border: 1px solid var(--line-1);
      border-radius: 6px;
      cursor: pointer;
      color: var(--ink-700);
      font-weight: 500;
    }
    .pagination button:hover:not(:disabled) { border-color: var(--line-2); }
    .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
    .pagination .page-info { color: var(--ink-500); font-size: 12.5px; }
  </style>
</head>
<body>
<div class="dash">

  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="topbar-brand"><span class="brand-chip">Z</span><span class="brand-word">Zaria</span></div>
    <div class="topbar-actions">
      <a class="btn-sm btn-outline" href="/admin/dashboard">Dashboard</a>
      <div class="avatar" id="avatarBtn">·</div>
    </div>
  </header>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar" id="sidebar">
    <nav>
      <div class="nav-group">
        <div class="nav-group-label">Overview</div>
        <a class="nav-item" href="/admin/dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h7V3H3zM14 21h7V10h-7zM3 21h7v-6H3zM14 7h7V3h-7z"/></svg>
          Dashboard
        </a>
        <a class="nav-item" href="/admin/loans">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16v12H4zM4 11h16"/></svg>
          Loans
          <span class="nav-badge warn" id="pendingLoansBadge" hidden></span>
        </a>
        <a class="nav-item" href="/admin/requests">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Requests
          <span class="nav-badge warn" id="pendingRequestsBadge" hidden></span>
        </a>
      </div>

      <div class="nav-group">
        <div class="nav-group-label">People</div>
        <a class="nav-item" href="/admin/clients">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          Clients
        </a>
        <a class="nav-item" href="/admin/registrations">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3.5"/><path d="m16 11 2 2 4-4"/></svg>
          Registrations
          <span class="nav-badge warn" id="pendingRegsBadge" hidden></span>
        </a>
        <a class="nav-item" href="/admin/chamas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="3"/><circle cx="17" cy="7" r="3"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2M14 21v-2a4 4 0 0 1 4-4h2a4 4 0 0 1 4 4v2"/></svg>
          Chamas
        </a>
      </div>

      <div class="nav-group">
        <div class="nav-group-label">Money</div>
        <a class="nav-item" href="/admin/savings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M6 8h12M6 16h12"/></svg>
          Savings
        </a>
        <a class="nav-item" href="/admin/shares">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18M7 16v-6M12 16V6M17 16v-9"/></svg>
          Shares
        </a>
        <a class="nav-item" href="/admin/dividends">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9h9"/></svg>
          Dividends
        </a>
        <a class="nav-item" href="/admin/transactions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v6H4zM4 14h16v6H4z"/></svg>
          Transactions
        </a>
        <a class="nav-item" href="/admin/reports">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 3 5-6"/></svg>
          Reports
        </a>
        <a class="nav-item" href="/admin/reports/sms">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          SMS reports
        </a>
        <a class="nav-item" href="/admin/broadcasts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 1 0 8M6 8a6 6 0 0 0 0 8"/><circle cx="12" cy="12" r="2"/></svg>
          Broadcasts
        </a>
      </div>

      <div class="nav-group">
        <div class="nav-group-label">System</div>
        <a class="nav-item active" href="/admin/audit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Audit log
        </a>
        <a class="nav-item" href="/admin/settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a22 22 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
          Settings
        </a>
      </div>
    </nav>
  </aside>


  <main class="main">
    <div class="page-head">
      <div>
        <h1 class="page-title">Audit log</h1>
        <p class="page-sub" id="countLabel">Loading…</p>
      </div>
      <div class="page-actions">
        <a class="btn-sm btn-outline" id="exportBtn" href="#" style="text-decoration:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 20h16"/></svg>
          Export CSV
        </a>
      </div>
    </div>

    <!-- Filters -->
    <section class="card" style="margin-bottom:16px">
      <div class="audit-filters">
        <div class="field">
          <label for="qInput">Search action or email</label>
          <input type="search" id="qInput" placeholder="e.g. loan.approved, admin@…">
        </div>
        <div class="field">
          <label for="actionSelect">Action</label>
          <select id="actionSelect">
            <option value="">All actions</option>
          </select>
        </div>
        <div class="field">
          <label for="roleSelect">Role</label>
          <select id="roleSelect">
            <option value="">All roles</option>
            <option value="admin">Admin</option>
            <option value="client">Client</option>
            <option value="system">System</option>
          </select>
        </div>
        <div class="field">
          <label for="fromDate">From</label>
          <input type="date" id="fromDate">
        </div>
        <div class="field">
          <label for="toDate">To</label>
          <input type="date" id="toDate">
        </div>
      </div>
      <div style="padding:0 16px 16px;display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="btn-sm btn-dark" id="applyBtn">Apply filters</button>
        <button type="button" class="btn-sm btn-outline" id="clearBtn">Clear</button>
      </div>
    </section>

    <!-- List -->
    <section class="card">
      <div id="listWrap">
        <div class="empty" style="padding:40px 20px">Loading…</div>
      </div>
      <div id="paginationWrap"></div>
    </section>
  </main>
</div>

<script src="/js/admin-audit.js" defer></script>
</body>
</html>
